<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#FF4E4E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="세동네 — 우리가 직접 가본 서울의 맛집">
  <title>세동네</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="splash" id="splash">
      <div class="splash-logo" id="splashLogo"></div>
      <p>우리가 직접 가본 서울의 맛집</p>
    </div>
    <main id="view" class="view"></main>
    <nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>
    <div class="sheet-layer" id="sheetLayer" hidden>
      <div class="sheet-dim" data-act="close-sheet"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
